version: '3.8'

services:
  music-notebook:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bxb-music-notebook
    restart: unless-stopped
    ports:
      # Default: reachable only from this host. There is NO application login.
      # For LAN/NAS access, replace with "3000:3000" ONLY on a trusted network, ideally behind
      # a VPN/tailnet with restrictive ACLs (see README "Network access").
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - MUSIC_NOTEBOOK_DATA_DIR=/data
    volumes:
      - ./storage:/data
